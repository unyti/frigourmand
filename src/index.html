<!doctype html>
<html lang="fr" data-theme="systeme" data-texte="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
  <title>Frigourmand</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>

  <header class="entete" id="entete"></header>
  <div id="bandeau-maj"></div>

  <main id="contenu" class="page" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-texte"></span>
    <button type="button" class="bouton-lien" id="toast-action" hidden></button>
  </div>

  <dialog class="dialogue" id="dialogue" aria-labelledby="dialogue-titre"></dialog>

  <p hidden id="aide-recherche">Tape quelques lettres, puis utilise les flèches pour choisir une suggestion et Entrée pour valider.</p>
  <div class="sr-only" id="annonce-recherche" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
