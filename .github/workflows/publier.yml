# Publie automatiquement une nouvelle version de Frigourmand.
# Déclenchement : chaque envoi sur master. Si la version de package.json n'a pas encore de release,
# GitHub compile l'installeur Windows et crée la release « vX.Y.Z » ; les Frigourmand installées
# la détectent et se mettent à jour toutes seules. Sinon, rien n'est fait.
name: Publier une version

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      nouvelle: ${{ steps.v.outputs.nouvelle }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ACTIFS=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$ACTIFS" | grep -qx 'latest.yml'; then
            echo "La version $VERSION est déjà publiée : rien à faire."
            echo "nouvelle=non" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$ACTIFS" ] || gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release v$VERSION incomplète : suppression avant de la reconstruire."
              gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
            echo "Nouvelle version $VERSION à publier."
            echo "nouvelle=oui" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.nouvelle == 'oui'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les données
        run: npm run check

      - name: Préparer la release (brouillon)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Notes de version : la section correspondante du CHANGELOG.
          awk -v v="## $VERSION" 'index($0, v) == 1 { garder = 1; next } /^## / { garder = 0 } garder' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "Frigourmand $VERSION" --notes-file notes.md

      - name: Construire et publier l'installeur
        shell: bash
        run: |
          set -o pipefail
          npm run publier 2>&1 | tee construction.log || {
            # En cas d'échec, les dernières lignes remontent en annotations (visibles sans ouvrir le journal).
            tail -n 40 construction.log | sed -e 's/%/%25/g' | while IFS= read -r ligne; do echo "::error::$ligne"; done
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rendre la release publique
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --latest
